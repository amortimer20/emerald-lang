# Temporary (throwaway branch): does the Windows Debug test hang happen when a test binary runs
# directly, without the build runner? Each binary runs many times, either with default stdin or with
# stdin held open by a pipe that never closes (as the build runner's --listen pipe is). A run that
# outlives its limit is a hang; exit 124 is how `timeout` reports it.
name: Windows direct-run experiment

on:
  push:
    branches:
      - claude/windows-stall-experiment
  workflow_dispatch:

jobs:
  direct:
    name: ${{ matrix.target }} / stdin ${{ matrix.stdin }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lsp, repl]
        stdin: [default, open]
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build the Debug test binaries (the runner may stall here; that is not the experiment)
        shell: bash
        run: |
          zig build test -Doptimize=Debug > build.log 2>&1 || echo "zig build test failed (see log); continuing to the binaries"
          tail -3 build.log | cut -c1-200
          find .zig-cache/o -name 'emerald-*.exe' | sort

      - name: Run emerald-${{ matrix.target }} directly, many times
        shell: bash
        run: |
          exe=$(ls -t $(find .zig-cache/o -name 'emerald-${{ matrix.target }}.exe') | head -1)
          echo "binary: $exe"
          if [ "${{ matrix.target }}" = "lsp" ]; then runs=120; limit=30; else runs=40; limit=45; fi
          pass=0; hang=0; other=0
          for i in $(seq 1 $runs); do
            start=$(date +%s)
            if [ "${{ matrix.stdin }}" = "open" ]; then
              timeout $limit "$exe" < <(sleep $((limit + 5))) > run.log 2>&1; code=$?
            else
              timeout $limit "$exe" > run.log 2>&1; code=$?
            fi
            secs=$(( $(date +%s) - start ))
            if [ $code -eq 0 ]; then pass=$((pass + 1)); result=pass
            elif [ $code -eq 124 ]; then hang=$((hang + 1)); result=HANG; tail -3 run.log | cut -c1-160
            else other=$((other + 1)); result="FAIL($code)"; tail -3 run.log | cut -c1-160; fi
            echo "run $i: $result in ${secs}s"
            [ $hang -ge 10 ] && { echo "stopping early: 10 hangs"; break; }
          done
          line="${{ matrix.target }} / stdin ${{ matrix.stdin }}: $pass passed, $hang hung, $other failed"
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
