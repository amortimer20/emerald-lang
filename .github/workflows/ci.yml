name: CI

on:
  # A change to Markdown alone (plans, the handoff, reference pages) tests
  # nothing new, so it does not start the whole matrix. Run `zig build test`
  # locally before pushing one: its style check reads the docs' emerald blocks.
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: debug
            optimize: Debug
          - os: ubuntu-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: macos-latest
            build: debug
            optimize: Debug
          - os: macos-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: windows-latest
            build: debug
            optimize: Debug
          - os: windows-latest
            build: release-safe
            optimize: ReleaseSafe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Check the vendor library recipe
        shell: bash
        run: bash tools/check-vendor.sh

      - name: Run test suite
        shell: bash
        run: zig build test -Doptimize=${{ matrix.optimize }} ${{ matrix.test_flags }}

      - name: Build and check the compiled cases
        shell: bash
        run: zig build test-compiler -Doptimize=${{ matrix.optimize }}

      - name: Check cancellation with live standard input
        shell: bash
        run: |
          zig build -j1 -Doptimize=${{ matrix.optimize }}
          python tools/task-input-cancellation.py

      - name: Measure Windows task costs
        if: matrix.os == 'windows-latest' && matrix.optimize == 'ReleaseSafe'
        shell: pwsh
        run: |
          $scheduler = Join-Path $env:RUNNER_TEMP 'emerald-scheduler-benchmark.exe'
          zig build-exe -O ReleaseSafe --dep Scheduler "-Mroot=tools/scheduler-benchmark.zig" -O ReleaseSafe "-MScheduler=src/runtime/Scheduler.zig" "-femit-bin=$scheduler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/measure-windows-tasks.ps1 -Scheduler $scheduler

  fuzz:
    name: bounded execution fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run fixed fuzz campaign
        shell: bash
        run: zig build fuzz -Doptimize=ReleaseSafe -- 12648430 1000

  bare-container:
    name: bare container (glibc 2.28)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Build for glibc 2.28
        shell: bash
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dtarget=x86_64-linux-gnu.2.28

      - name: Run in a bare container
        shell: bash
        # The image carries no display libraries: emerald must need only libc.
        run: |
          mkdir -p bare
          cp zig-out/bin/emerald bare/emerald
          printf 'print("hello")\n' > bare/hello.em
          docker run --rm -v "$PWD/bare:/e:ro" ubuntu:20.04 /e/emerald --version
          out="$(docker run --rm -v "$PWD/bare:/e:ro" ubuntu:20.04 /e/emerald run /e/hello.em)"
          test "$out" = "hello"
