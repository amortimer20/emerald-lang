name: CI

on:
  # A change to Markdown alone (plans, the handoff, reference pages) tests
  # nothing new, so it does not start the whole matrix. Run `zig build test`
  # locally before pushing one: its style check reads the docs' emerald blocks.
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: debug
            optimize: Debug
          - os: ubuntu-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: macos-latest
            build: debug
            optimize: Debug
          - os: macos-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: windows-latest
            build: debug
            optimize: Debug
            # Zig 0.16.0's Windows process spawning lets a test binary inherit a sibling's
            # stdout pipe when two start at once, so a finished binary's step waits on the
            # sibling and fails "test runner failed to respond". Zig 0.17.0 fixes it
            # (process_spawn_mutex); remove -j1 here and below with the upgrade (roadmap
            # item 8). See docs/handoff.md, "Windows test stall".
            test_flags: -j1
          - os: windows-latest
            build: release-safe
            optimize: ReleaseSafe
            # The same race: it stalled here too (emerald-lsp, PR #50, 2026-10-28).
            test_flags: -j1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run test suite
        shell: bash
        run: zig build test -Doptimize=${{ matrix.optimize }} ${{ matrix.test_flags }}

      - name: Check cancellation with live standard input
        shell: bash
        run: |
          zig build -j1 -Doptimize=${{ matrix.optimize }}
          python tools/task-input-cancellation.py

      - name: Measure Windows task costs
        if: matrix.os == 'windows-latest' && matrix.optimize == 'ReleaseSafe'
        shell: pwsh
        run: |
          $scheduler = Join-Path $env:RUNNER_TEMP 'emerald-scheduler-benchmark.exe'
          zig build-exe -O ReleaseSafe --dep Scheduler "-Mroot=tools/scheduler-benchmark.zig" -O ReleaseSafe "-MScheduler=src/Scheduler.zig" "-femit-bin=$scheduler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/measure-windows-tasks.ps1 -Scheduler $scheduler

  fuzz:
    name: bounded execution fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run fixed fuzz campaign
        shell: bash
        run: zig build fuzz -Doptimize=ReleaseSafe -- 12648430 1000
