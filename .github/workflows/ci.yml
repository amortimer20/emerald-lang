name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: debug
            optimize: Debug
          - os: ubuntu-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: macos-latest
            build: debug
            optimize: Debug
          - os: windows-latest
            build: debug
            optimize: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run test suite
        shell: bash
        run: zig build test -Doptimize=${{ matrix.optimize }}
