name: CI

on:
  # A change to Markdown alone (plans, the handoff, reference pages) tests
  # nothing new, so it does not start the whole matrix. Run `zig build test`
  # locally before pushing one: its style check reads the docs' emerald blocks.
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: debug
            optimize: Debug
          - os: ubuntu-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: macos-latest
            build: debug
            optimize: Debug
          - os: macos-latest
            build: release-safe
            optimize: ReleaseSafe
          - os: windows-latest
            build: debug
            optimize: Debug
          - os: windows-latest
            build: release-safe
            optimize: ReleaseSafe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run test suite
        shell: bash
        run: zig build test -Doptimize=${{ matrix.optimize }}

  fuzz:
    name: bounded execution fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain with Mise
        uses: jdx/mise-action@v2

      - name: Validate toolchain
        shell: bash
        run: bash tools/check-toolchain.sh

      - name: Run fixed fuzz campaign
        shell: bash
        run: zig build fuzz -Doptimize=ReleaseSafe -- 12648430 1000
