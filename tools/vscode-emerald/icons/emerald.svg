<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Emerald</title>
  <!--
    An emerald-cut gem: an octagon (rectangle with bevelled corners), a flat table on
    top, and facets running to the girdle. Kept bold and low-detail on purpose — a file
    icon is usually drawn at 16px, where anything finer turns to mud.
  -->
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CFFC4"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#00A85A"/>
    </linearGradient>
  </defs>

  <!-- outline -->
  <path fill="url(#body)"
        d="M10 3h12l4 4v18l-4 4H10l-4-4V7z"/>

  <!-- table -->
  <path fill="url(#table)"
        d="M11.5 8.5h9l2 2v11l-2 2h-9l-2-2v-11z"/>

  <!-- crown facets -->
  <path fill="#004D2B" fill-opacity="0.35"
        d="M10 3h12l-1.5 5.5h-9zM6 7l4-4 1.5 5.5-2 2zM26 7l-4-4-1.5 5.5 2 2z"/>

  <!-- pavilion facets -->
  <path fill="#004D2B" fill-opacity="0.35"
        d="M10 29h12l-1.5-5.5h-9zM6 25l4 4 1.5-5.5-2-2zM26 25l-4 4-1.5-5.5 2-2z"/>

  <!-- highlight -->
  <path fill="#EAFFF5" fill-opacity="0.55"
        d="M12.5 10h5l-5 5z"/>
</svg>
