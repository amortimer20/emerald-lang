<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Emerald</title>
  <!--
    An emerald-cut gem: an octagon with a flat table on top and facets running to the
    girdle. Bold and low-detail on purpose — a file icon is read at 16px in a sidebar,
    where anything finer turns to mud.

    Sized to fill the canvas the way vscode-icons' own glyphs do (4..28 across, 2..30
    down). The repo's tools/vscode-emerald/icons/emerald.svg is the same drawing at a
    smaller scale, which looked undersized beside the built-in icons.
  -->
  <defs>
    <linearGradient id="em-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CFFC4"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="em-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#00A85A"/>
    </linearGradient>
  </defs>

  <!-- girdle: the outer octagon -->
  <path fill="url(#em-body)"
        d="M9 2h14l5 5v18l-5 5H9l-5-5V7z"/>

  <!-- table: the flat face, echoing the outline so the cut reads as one shape -->
  <path fill="url(#em-table)"
        d="M12 8h8l3.5 3.5v9L20 24h-8l-3.5-3.5v-9z"/>

  <!-- crown facets, table down to the girdle -->
  <path fill="#004D2B" fill-opacity="0.35"
        d="M9 2h14l-3 6h-8zM4 7l5-5 3 6-3.5 3.5zM28 7l-5-5-3 6 3.5 3.5z"/>

  <!-- pavilion facets, the same three mirrored -->
  <path fill="#004D2B" fill-opacity="0.35"
        d="M9 30h14l-3-6h-8zM4 25l5 5 3-6-3.5-3.5zM28 25l-5 5-3-6 3.5-3.5z"/>

  <!-- a single highlight, which is all that survives at 16px -->
  <path fill="#EAFFF5" fill-opacity="0.55"
        d="M13 10h5l-5 5z"/>
</svg>
